name: Temporary owner-authorized VIP100 gameplay OIDC dispatch bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lab-oidc-gameplay-dispatch-once.yml'

permissions:
  contents: none
  actions: write

concurrency:
  group: isolated-vip100-gameplay-oidc-dispatch-once-20261112
  cancel-in-progress: false

jobs:
  dispatch-one:
    name: One-off exact-title OIDC gameplay workflow dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail closed to exact user-approved dry/live command titles
        env:
          GITHUB_TEMP_TOKEN: ${{ github.token }}
          PUSH_TITLE: ${{ github.event.head_commit.message }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const repo='jtkmanga/Snakes-and-Ladders';
          const target='lab-oidc-manual.yml';
          const dry='RUN_ONCE_VIP100_GAMEPLAY_DRY_20261112';
          const live='RUN_ONCE_VIP100_GAMEPLAY_LIVE_20261112';
          assert.equal(process.env.GITHUB_EVENT_NAME,'push');
          assert.equal(process.env.GITHUB_REPOSITORY,repo);
          assert.equal(process.env.GITHUB_REF,'refs/heads/main');
          assert.equal(process.env.GITHUB_WORKFLOW_REF,repo+
           '/.github/workflows/lab-oidc-gameplay-dispatch-once.yml@refs/heads/main');
          const title=String(process.env.PUSH_TITLE||'').split('\n')[0].trim();
          assert.ok(title===dry||title===live,'Not an approved one-shot commit');
          const token=process.env.GITHUB_TEMP_TOKEN;
          assert.ok(typeof token==='string'&&token.length>20,'Missing ephemeral job capability');
          const isLive=title===live;
          const response=await fetch('https://api.github.com/repos/'+repo+
            '/actions/workflows/'+target+'/dispatches',{
            method:'POST',
            headers:{Authorization:'Bearer '+token,
              Accept:'application/vnd.github+json','Content-Type':'application/json',
              'X-GitHub-Api-Version':'2022-11-28'},
            body:JSON.stringify({ref:'main',
              inputs:{run_vip100:false,run_vip100_gameplay:isLive}}),
            redirect:'error',signal:AbortSignal.timeout(12000)
          });
          assert.equal(response.status,204,'Github rejected ephemeral workflow_dispatch');
          console.log('OIDC_GAMEPLAY_DISPATCH_CONFIRMED '+JSON.stringify({
            target,live:isLive,http:response.status,
            noPrivateSource:true,noUserToken:true,noCloudflareAdminKey:true
          }));
          NODE
# One-time owner-authorized 100 synthetic VIP gameplay/reconnect load, 12 Nov 2026.
