name: Public free runner - isolated no-secret health probe

on:
  push:
    branches: [ci/public-free-runner-safe-probe-20261111]

permissions:
  contents: read

concurrency:
  group: public-free-runner-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-secret-health:
    name: Public runner and isolated lab disabled-health verification
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify standard runner starts without paid resources or secrets
        run: |
          node --version
          echo "PUBLIC_FREE_RUNNER_STARTED"
      - name: Read only public no-secret Load Lab health
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const host = 'snakes-and-ladders-game-loadlab.jtkmanga.workers.dev';
          const response = await fetch('https://' + host + '/lab/health', {
            method: 'GET',
            redirect: 'error',
            signal: AbortSignal.timeout(12000)
          });
          assert.equal(response.status, 200, 'Expected publicly readable isolated Lab health');
          const h = await response.json();
          assert.equal(h.isolated, true);
          assert.equal(h.enabled, false, 'Lab must remain disabled');
          assert.equal(h.maxClients, 100);
          assert.equal(h.paymentEnabled, false);
          assert.equal(h.gameDataConnected, false);
          assert.equal(h.realUserAuth, false);
          console.log('PASS: public no-secret health; isolated Lab remains disabled');
          NODE
