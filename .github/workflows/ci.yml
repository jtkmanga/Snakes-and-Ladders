name: Validate game
on:
  push:
    branches: [main, feature/paper-race-mvp]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Validate source when uploaded
        run: |
          if [ -f src/index.js ] && [ -f public/game.js ] && [ -f tests/rules.test.js ]; then
            npm run check
          else
            echo 'Awaiting source upload; scaffold only.'
          fi
